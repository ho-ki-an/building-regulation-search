<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>建築基準法関係規定等規制検索</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #102231;
      --muted: #637685;
      --line: #dce5e9;
      --paper: #ffffff;
      --accent: #08786b;
      --accent-strong: #056258;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "YuGothic", "Meiryo", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f2f6f7;
      color: var(--ink);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .shell {
      width: min(1440px, calc(100% - 32px));
      margin: 0 auto;
      padding: 18px 0 30px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 28px;
      align-items: center;
      padding: 20px 26px 18px;
      border: 1px solid #e2eaed;
      border-bottom: 0;
      border-radius: 10px 10px 0 0;
      background: rgba(255, 255, 255, .8);
      box-shadow: 0 8px 28px rgba(31, 55, 66, .07);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 22px;
      min-width: 0;
    }

    .brand-mark {
      width: 72px;
      height: 72px;
      flex: 0 0 72px;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .brand-mark img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    h1 {
      margin: 0;
      font-size: 40px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .lead {
      margin: 8px 0 0;
      max-width: 780px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 15px;
    }

    .count {
      min-width: 240px;
      min-height: 104px;
      display: grid;
      grid-template-columns: 58px auto;
      grid-template-rows: 1fr 1fr;
      column-gap: 18px;
      align-items: center;
      padding: 17px 28px;
      border: 1px solid #e0e8eb;
      border-radius: 8px;
      background: #fff;
      text-align: left;
      box-shadow: 0 8px 24px rgba(31, 55, 66, .1);
    }

    .count-check {
      grid-row: 1 / 3;
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #ddf0eb;
      color: var(--accent);
      font-size: 29px;
      font-weight: 900;
    }

    .count strong {
      display: block;
      align-self: end;
      font-size: 42px;
      line-height: .95;
      color: var(--accent);
    }

    .count span {
      align-self: start;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .panel {
      background: #fff;
      border: 1px solid #e2eaed;
      border-radius: 0 0 10px 10px;
      box-shadow: 0 12px 34px rgba(31, 55, 66, .09);
      overflow: hidden;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(360px, 1fr) 205px 210px 58px;
      gap: 20px;
      align-items: end;
      padding: 24px 24px 22px;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
    }

    label {
      display: grid;
      gap: 7px;
      color: #566b79;
      font-size: 13px;
      font-weight: 700;
    }

    input[type="search"],
    select {
      width: 100%;
      height: 58px;
      border: 1px solid #cad7dd;
      border-radius: 6px;
      padding: 0 16px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }

    #areaInput {
      font-size: 21px;
      font-weight: 400;
    }

    #areaInput::placeholder {
      font-size: 15px;
    }

    input[type="search"]:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(8, 120, 107, .13);
    }

    .icon-button,
    .primary {
      height: 58px;
      border-radius: 6px;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      font-weight: 700;
    }

    .primary {
      position: relative;
      padding: 0 22px 0 48px;
      background: var(--accent);
      color: #fff;
      font-size: 16px;
      box-shadow: 0 5px 12px rgba(8, 120, 107, .18);
    }

    .primary::before {
      content: "";
      position: absolute;
      left: 22px;
      width: 12px;
      height: 12px;
      border: 2px solid currentColor;
      border-radius: 50%;
    }

    .primary::after {
      content: "";
      position: absolute;
      left: 35px;
      top: 34px;
      width: 7px;
      height: 2px;
      background: currentColor;
      transform: rotate(45deg);
      transform-origin: left center;
    }

    .primary:hover {
      background: var(--accent-strong);
    }

    .primary:disabled {
      cursor: not-allowed;
      opacity: .48;
    }

    .icon-button {
      width: 58px;
      background: #fff;
      border-color: var(--line);
      color: var(--ink);
    }

    .icon-button:hover {
      border-color: #9fb0b8;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px 16px;
      background: #fff;
    }

    .chips {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .chip {
      min-height: 44px;
      padding: 0 20px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 3px 9px rgba(31, 55, 66, .04);
    }

    .chip:first-child {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .chip:hover {
      border-color: var(--accent);
    }

    .query-filter {
      max-width: 310px;
      height: 46px !important;
      padding-left: 42px !important;
      font-size: 14px;
      background:
        radial-gradient(circle at 19px 20px, transparent 6px, #526773 6px, #526773 7.5px, transparent 7.5px),
        linear-gradient(45deg, transparent 49%, #526773 50%, #526773 58%, transparent 59%) 27px 27px / 8px 8px no-repeat,
        #fff !important;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
      padding: 0 10px 10px;
    }

    .item {
      min-height: 76px;
      border: 1px solid #e3eaed;
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 3px 10px rgba(31, 55, 66, .06);
      transition: background .15s ease, border-color .15s ease, box-shadow .15s ease;
    }

    .item:hover {
      border-color: #c8d8dd;
      background: #fbfdfd;
      box-shadow: 0 5px 14px rgba(31, 55, 66, .09);
    }

    .grid.search-ready .item:has(input:not(:checked)) {
      background: #edf1f3;
    }

    .grid.search-ready .item:has(input:not(:checked)):hover {
      background: #e5ebee;
    }

    .item label {
      height: 100%;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 13px;
      padding: 13px 14px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
    }

    .item input {
      appearance: none;
      width: 22px;
      height: 22px;
      margin: 0;
      border: 1.5px solid #9ba8ae;
      border-radius: 2px;
      background: #fff;
    }

    .item input:checked {
      border-color: var(--accent);
      background: var(--accent);
    }

    .item input:checked::after {
      content: "";
      display: block;
      width: 9px;
      height: 5px;
      margin: 5px 0 0 5px;
      border-left: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(-45deg);
    }

    .keyword {
      line-height: 1.45;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .open-link {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--accent-strong);
      background: #fff;
      border: 1px solid #cfdde1;
      font-weight: 900;
    }

    .open-link[aria-disabled="true"] {
      opacity: .36;
    }

    .open-link[aria-disabled="false"] {
      font-size: 1.2em;
      border-width: 5px;
      -webkit-text-stroke: 1.2px currentColor;
    }

    .status {
      min-height: 60px;
      display: flex;
      align-items: center;
      padding: 14px 24px 20px;
      color: var(--muted);
      font-size: 14px;
      background: #fff;
    }

    .status strong {
      color: var(--accent);
    }

    .results {
      display: none !important;
    }

    .copy-button {
      position: relative;
    }

    .copy-button::before,
    .copy-button::after {
      content: "";
      position: absolute;
      width: 13px;
      height: 15px;
      border: 2px solid currentColor;
      border-radius: 3px;
      background: #fff;
    }

    .copy-button::before {
      transform: translate(-2px, 2px);
      opacity: .55;
    }

    .copy-button::after {
      transform: translate(3px, -3px);
    }

    @media (max-width: 1100px) {
      .controls {
        grid-template-columns: minmax(280px, 1fr) 190px;
      }

      .primary,
      .icon-button {
        width: 100%;
      }

      .grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 820px) {
      header,
      .controls {
        grid-template-columns: 1fr;
      }

      .count {
        min-width: 0;
        width: 100%;
      }

      .toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      .query-filter {
        max-width: none;
      }

      .icon-button {
        width: 58px;
        justify-self: end;
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      .shell {
        width: min(100% - 16px, 1440px);
        padding-top: 8px;
      }

      header {
        padding: 18px;
      }

      .brand {
        align-items: flex-start;
        gap: 13px;
      }

      .brand-mark {
        width: 56px;
        height: 56px;
        flex-basis: 56px;
      }

      .controls,
      .toolbar {
        padding-left: 12px;
        padding-right: 12px;
      }

      .grid {
        grid-template-columns: 1fr;
        padding-left: 8px;
        padding-right: 8px;
      }

      h1 {
        font-size: 28px;
      }

      .lead {
        font-size: 13px;
      }

      .count {
        min-height: 84px;
        grid-template-columns: 48px auto;
        padding: 14px 20px;
      }

      .count-check {
        width: 48px;
        height: 48px;
      }

      .count strong {
        font-size: 34px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <img src="building-icon.png" alt="">
        </div>
        <div>
          <h1>建築基準法関係規定等規制検索</h1>
          <p class="lead">行政区名と規制項目を組み合わせて、計画地調査の初動検索をまとめて作成します。</p>
        </div>
      </div>
      <div class="count" aria-live="polite">
        <span class="count-check" aria-hidden="true">✓</span>
        <strong id="selectedCount">0</strong>
        <span>選択中</span>
      </div>
    </header>

    <section class="panel" aria-label="検索条件">
      <div class="controls">
        <label>
          行政区
          <input id="areaInput" type="search" placeholder="例：東京都 港区 / 大阪市 北区" autocomplete="address-level2">
        </label>
        <label>
          検索先
          <select id="engineSelect">
            <option value="google">Google</option>
            <option value="yahoo">Yahoo! JAPAN</option>
            <option value="bing">Bing</option>
          </select>
        </label>
        <button class="primary" id="openSelected" type="button">選択項目を開く</button>
        <button class="icon-button copy-button" id="copyQueries" type="button" title="検索語をコピー" aria-label="検索語をコピー"></button>
      </div>

      <div class="toolbar">
        <div class="chips" aria-label="選択操作">
          <button class="chip" id="selectAll" type="button">全選択</button>
          <button class="chip" id="clearAll" type="button">解除</button>
        </div>
        <input class="query-filter" id="keywordFilter" type="search" placeholder="項目を絞り込み">
      </div>

      <div class="grid" id="keywordGrid" aria-label="規制項目"></div>
      <div class="status" id="status">行政区を入力すると各項目の検索リンクが有効になります。</div>
      <div class="results" id="results">
        <h2>検索リンク</h2>
        <ul class="result-list" id="resultList"></ul>
      </div>
    </section>
  </main>

  <script>
    const keywords = [
      "都市計画区域",
      "用途地域",
      "形態制限",
      "指定容積率",
      "指定建蔽率",
      "防火地域",
      "最低敷地面積",
      "高度地区",
      "日影規制",
      "特別用途地区",
      "風致地区",
      "開発許可",
      "特定盛土規制法",
      "警戒区域",
      "市街地開発事業",
      "都市計画施設",
      "地区計画",
      "道路",
      "下水道",
      "浄化槽",
      "駐車場条例",
      "駐輪場条例",
      "バリアフリー条例",
      "中高層建築物条例",
      "建築基準条例",
      "都市緑地法",
      "屋外広告物条例",
      "港湾法",
      "斜面地条例",
      "流通業務市街地整備法",
      "特定都市河川浸水被害対策法",
      "建築協定区域",
      "一団地の区域"
    ];

    const areaInput = document.querySelector("#areaInput");
    const engineSelect = document.querySelector("#engineSelect");
    const keywordGrid = document.querySelector("#keywordGrid");
    const keywordFilter = document.querySelector("#keywordFilter");
    const selectedCount = document.querySelector("#selectedCount");
    const status = document.querySelector("#status");
    const openSelected = document.querySelector("#openSelected");
    const copyQueries = document.querySelector("#copyQueries");
    const results = document.querySelector("#results");
    const resultList = document.querySelector("#resultList");
    let resultOrder = [];
    let draggedKeyword = "";
    let pointerDraggedItem = null;
    let searchReady = false;

    const searchUrls = {
      google: query => `https://www.google.com/search?q=${encodeURIComponent(query)}`,
      yahoo: query => `https://search.yahoo.co.jp/search?p=${encodeURIComponent(query)}`,
      bing: query => `https://www.bing.com/search?q=${encodeURIComponent(query)}`
    };

    function makeQuery(keyword) {
      return `${areaInput.value.trim()} ${keyword}`.trim();
    }

    function makeUrl(keyword) {
      return searchUrls[engineSelect.value](makeQuery(keyword));
    }

    function getVisibleItems() {
      return Array.from(keywordGrid.querySelectorAll(".item")).filter(item => !item.hidden);
    }

    function getSelectedKeywords() {
      return Array.from(keywordGrid.querySelectorAll("input[type='checkbox']:checked")).map(input => input.value);
    }

    function getOrderedSelectedKeywords() {
      const selected = getSelectedKeywords();
      const selectedSet = new Set(selected);
      resultOrder = [
        ...resultOrder.filter(keyword => selectedSet.has(keyword)),
        ...selected.filter(keyword => !resultOrder.includes(keyword))
      ];
      return resultOrder;
    }

    function updateLinks() {
      const hasArea = areaInput.value.trim().length > 0;
      keywordGrid.classList.toggle("search-ready", searchReady);
      keywordGrid.querySelectorAll(".open-link").forEach(link => {
        const keyword = link.dataset.keyword;
        link.href = hasArea && searchReady ? makeUrl(keyword) : "#";
        link.setAttribute("aria-disabled", String(!hasArea || !searchReady));
      });

      const selected = getOrderedSelectedKeywords();
      selectedCount.textContent = selected.length;
      openSelected.disabled = selected.length === 0 || !hasArea;
      renderResults(hasArea && searchReady, selected);

      if (!hasArea) {
        status.textContent = "行政区を入力すると各項目の検索リンクが有効になります。";
      } else if (selected.length === 0) {
        status.textContent = "検索したい規制項目を選択してください。";
      } else if (!searchReady) {
        status.textContent = "「選択項目を開く」を押すと、選択した項目の検索リンクが有効になります。";
      } else {
        status.textContent = `${areaInput.value.trim()} と ${selected.length} 件の検索リンクを表示しました。`;
      }
    }

    function renderResults(hasArea, selected) {
      resultList.innerHTML = "";
      results.classList.toggle("is-visible", hasArea && selected.length > 0);

      if (!hasArea || selected.length === 0) return;

      selected.forEach(keyword => {
        const item = document.createElement("li");
        item.className = "result-item";
        item.draggable = true;
        item.dataset.keyword = keyword;

        const handle = document.createElement("span");
        handle.className = "drag-handle";
        handle.textContent = "⋮⋮";
        handle.title = "ドラッグして並べ替え";
        handle.ariaLabel = `${keyword}を並べ替え`;

        const link = document.createElement("a");
        link.href = makeUrl(keyword);
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = makeQuery(keyword);
        item.append(handle, link);
        resultList.append(item);
      });
    }

    function renderKeywords() {
      const filter = keywordFilter.value.trim().toLowerCase();
      keywordGrid.innerHTML = "";

      keywords.forEach(keyword => {
        const item = document.createElement("div");
        item.className = "item";
        item.hidden = filter.length > 0 && !keyword.toLowerCase().includes(filter);

        const label = document.createElement("label");
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = keyword;

        const name = document.createElement("span");
        name.className = "keyword";
        name.textContent = keyword;

        const link = document.createElement("a");
        link.className = "open-link";
        link.dataset.keyword = keyword;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "↗";
        link.ariaLabel = `${keyword}を検索`;

        label.append(checkbox, name, link);
        item.append(label);
        keywordGrid.append(item);
      });

      updateLinks();
    }

    function setVisibleChecks(checked) {
      getVisibleItems().forEach(item => {
        item.querySelector("input[type='checkbox']").checked = checked;
      });
      updateLinks();
    }

    document.querySelector("#selectAll").addEventListener("click", () => setVisibleChecks(true));
    document.querySelector("#clearAll").addEventListener("click", () => setVisibleChecks(false));

    keywordGrid.addEventListener("change", updateLinks);
    keywordGrid.addEventListener("click", event => {
      const link = event.target.closest(".open-link");
      if (!link) return;

      event.stopPropagation();
      if (link.getAttribute("aria-disabled") === "true") {
        event.preventDefault();
      }
    });
    areaInput.addEventListener("input", () => {
      searchReady = false;
      updateLinks();
    });
    engineSelect.addEventListener("change", updateLinks);
    keywordFilter.addEventListener("input", renderKeywords);

    resultList.addEventListener("dragstart", event => {
      const item = event.target.closest(".result-item");
      if (!item) return;
      draggedKeyword = item.dataset.keyword;
      item.classList.add("is-dragging");
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", draggedKeyword);
    });

    resultList.addEventListener("dragover", event => {
      const item = event.target.closest(".result-item");
      if (!item || item.dataset.keyword === draggedKeyword) return;
      event.preventDefault();
      resultList.querySelectorAll(".is-drag-over").forEach(target => target.classList.remove("is-drag-over"));
      item.classList.add("is-drag-over");
      event.dataTransfer.dropEffect = "move";
    });

    resultList.addEventListener("dragleave", event => {
      const item = event.target.closest(".result-item");
      if (item && !item.contains(event.relatedTarget)) item.classList.remove("is-drag-over");
    });

    resultList.addEventListener("drop", event => {
      const target = event.target.closest(".result-item");
      if (!target || !draggedKeyword || target.dataset.keyword === draggedKeyword) return;
      event.preventDefault();

      const fromIndex = resultOrder.indexOf(draggedKeyword);
      const targetIndex = resultOrder.indexOf(target.dataset.keyword);
      const targetBox = target.getBoundingClientRect();
      const placeAfter = event.clientY > targetBox.top + targetBox.height / 2;

      resultOrder.splice(fromIndex, 1);
      const adjustedTargetIndex = resultOrder.indexOf(target.dataset.keyword);
      resultOrder.splice(adjustedTargetIndex + (placeAfter ? 1 : 0), 0, draggedKeyword);
      renderResults(true, resultOrder);
    });

    resultList.addEventListener("dragend", () => {
      draggedKeyword = "";
      resultList.querySelectorAll(".result-item").forEach(item => {
        item.classList.remove("is-dragging", "is-drag-over");
      });
    });

    resultList.addEventListener("pointerdown", event => {
      const handle = event.target.closest(".drag-handle");
      if (!handle) return;

      event.preventDefault();
      pointerDraggedItem = handle.closest(".result-item");
      pointerDraggedItem.classList.add("is-dragging");
      handle.setPointerCapture?.(event.pointerId);
    });

    document.addEventListener("pointermove", event => {
      if (!pointerDraggedItem) return;
      event.preventDefault();

      const target = document.elementFromPoint(event.clientX, event.clientY)?.closest(".result-item");
      if (!target || target === pointerDraggedItem || !resultList.contains(target)) return;

      const box = target.getBoundingClientRect();
      const sameRow = Math.abs(event.clientY - (box.top + box.height / 2)) < box.height / 2;
      const placeAfter = sameRow
        ? event.clientX > box.left + box.width / 2
        : event.clientY > box.top + box.height / 2;

      resultList.insertBefore(pointerDraggedItem, placeAfter ? target.nextSibling : target);
    }, { passive: false });

    document.addEventListener("pointerup", () => {
      if (!pointerDraggedItem) return;

      pointerDraggedItem.classList.remove("is-dragging");
      resultOrder = Array.from(resultList.querySelectorAll(".result-item")).map(item => item.dataset.keyword);
      pointerDraggedItem = null;
    });

    openSelected.addEventListener("click", () => {
      const selected = getOrderedSelectedKeywords();
      if (!areaInput.value.trim() || selected.length === 0) {
        updateLinks();
        return;
      }

      searchReady = true;
      updateLinks();
      status.innerHTML = `<strong>${selected.length}件</strong> の矢印と検索リンクを有効にしました。`;
    });

    copyQueries.addEventListener("click", async () => {
      const selected = getOrderedSelectedKeywords();
      const targets = selected.length > 0 ? selected : keywords;
      const text = targets.map(makeQuery).join("\n");

      if (!areaInput.value.trim()) {
        status.textContent = "行政区を入力してからコピーしてください。";
        return;
      }

      try {
        await navigator.clipboard.writeText(text);
        status.textContent = `${targets.length} 件の検索語をコピーしました。`;
      } catch {
        status.textContent = "コピーできませんでした。ブラウザの権限を確認してください。";
      }
    });

    renderKeywords();
  </script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>建築規制検索</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172026;
      --muted: #62717c;
      --line: #d7e0e6;
      --soft: #f4f7f8;
      --paper: #ffffff;
      --accent: #0f6b63;
      --accent-strong: #084c47;
      --gold: #c58b28;
      --rose: #b64b5b;
      --shadow: 0 18px 48px rgba(20, 38, 48, .12);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "YuGothic", "Meiryo", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(15, 107, 99, .14), transparent 32%),
        linear-gradient(315deg, rgba(198, 139, 40, .14), transparent 36%),
        #eef3f4;
      color: var(--ink);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: end;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 48px;
      line-height: 1.02;
      letter-spacing: 0;
    }

    .lead {
      margin: 12px 0 0;
      max-width: 720px;
      color: var(--muted);
      line-height: 1.75;
      font-size: 15px;
    }

    .count {
      min-width: 148px;
      padding: 13px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .76);
      text-align: right;
      box-shadow: 0 10px 30px rgba(20, 38, 48, .08);
    }

    .count strong {
      display: block;
      font-size: 30px;
      line-height: 1;
      color: var(--accent-strong);
    }

    .count span {
      color: var(--muted);
      font-size: 12px;
    }

    .panel {
      background: rgba(255, 255, 255, .92);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) minmax(150px, 190px) auto auto;
      gap: 12px;
      align-items: end;
      padding: 18px;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    input[type="search"],
    select {
      width: 100%;
      height: 44px;
      border: 1px solid #bdcbd2;
      border-radius: 6px;
      padding: 0 12px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }

    #areaInput {
      height: 54px;
      font-size: 24px;
      font-weight: 400;
    }

    #areaInput::placeholder {
      font-size: 16px;
    }

    input[type="search"]:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 107, 99, .16);
    }

    .icon-button,
    .primary {
      height: 44px;
      border-radius: 6px;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
      font-weight: 700;
    }

    .primary {
      padding: 0 18px;
      background: var(--accent);
      color: #fff;
    }

    .primary:hover {
      background: var(--accent-strong);
    }

    .icon-button {
      width: 44px;
      background: var(--soft);
      border-color: var(--line);
      color: var(--ink);
    }

    .icon-button:hover {
      border-color: #9fb0b8;
      background: #fff;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: #f8fafb;
    }

    .toolbar-actions,
    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
    }

    .chip:hover {
      border-color: var(--accent);
      color: var(--accent-strong);
    }

    .query-filter {
      max-width: 260px;
      height: 38px;
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 0;
    }

    .item {
      min-height: 92px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: #fff;
      transition: background .15s ease;
    }

    .item:hover {
      background: #fbfdfd;
    }

    .item label {
      height: 100%;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: start;
      gap: 10px;
      padding: 16px;
      color: var(--ink);
      font-size: 15px;
      font-weight: 800;
    }

    .item input {
      width: 18px;
      height: 18px;
      margin: 2px 0 0;
      accent-color: var(--accent);
    }

    .keyword {
      line-height: 1.45;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .open-link {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--accent-strong);
      background: #eaf3f2;
      border: 1px solid #cee0dd;
      font-weight: 900;
    }

    .open-link[aria-disabled="true"] {
      opacity: .36;
    }

    .open-link[aria-disabled="false"] {
      font-size: 1.2em;
    }

    .status {
      min-height: 34px;
      padding: 10px 18px 16px;
      color: var(--muted);
      font-size: 13px;
      background: #fff;
    }

    .status strong {
      color: var(--rose);
    }

    .results {
      display: none !important;
      border-top: 1px solid var(--line);
      background: #fff;
      padding: 14px 18px 18px;
    }

    .results.is-visible {
      display: block;
    }

    .results h2 {
      margin: 0 0 10px;
      font-size: 15px;
      line-height: 1.4;
      letter-spacing: 0;
    }

    .result-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .result-item {
      min-width: 0;
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      align-items: stretch;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #f8fbfb;
      transition: border-color .15s ease, opacity .15s ease;
    }

    .result-item.is-dragging {
      opacity: .38;
    }

    .result-item.is-drag-over {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(197, 139, 40, .2);
    }

    .drag-handle {
      display: grid;
      place-items: center;
      border: 0;
      border-right: 1px solid var(--line);
      border-radius: 5px 0 0 5px;
      background: #eef4f4;
      color: var(--muted);
      cursor: grab;
      font-size: 18px;
      line-height: 1;
      touch-action: none;
      user-select: none;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .result-list a {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 11px;
      border: 0;
      border-radius: 0 5px 5px 0;
      color: var(--accent-strong);
      background: transparent;
      text-decoration: none;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .result-list a:hover {
      background: #edf6f4;
    }

    .result-list a::after {
      content: "↗";
      flex: 0 0 auto;
      font-weight: 900;
    }

    .copy-button {
      position: relative;
    }

    .copy-button::before,
    .copy-button::after {
      content: "";
      position: absolute;
      width: 13px;
      height: 15px;
      border: 2px solid currentColor;
      border-radius: 3px;
      background: #fff;
    }

    .copy-button::before {
      transform: translate(-2px, 2px);
      opacity: .55;
    }

    .copy-button::after {
      transform: translate(3px, -3px);
    }

    @media (max-width: 820px) {
      header,
      .controls {
        grid-template-columns: 1fr;
      }

      .count {
        text-align: left;
      }

      .toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      .query-filter {
        max-width: none;
      }
    }

    @media (max-width: 520px) {
      .shell {
        width: min(100% - 20px, 1180px);
        padding-top: 18px;
      }

      .controls,
      .toolbar {
        padding-left: 12px;
        padding-right: 12px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .result-list {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 34px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>建築規制検索</h1>
        <p class="lead">行政区名と規制項目を組み合わせて、計画地調査の初動検索をまとめて作成します。</p>
      </div>
      <div class="count" aria-live="polite">
        <strong id="selectedCount">0</strong>
        <span>選択中</span>
      </div>
    </header>

    <section class="panel" aria-label="検索条件">
      <div class="controls">
        <label>
          行政区
          <input id="areaInput" type="search" placeholder="例：東京都 港区 / 大阪市 北区" autocomplete="address-level2">
        </label>
        <label>
          検索先
          <select id="engineSelect">
            <option value="google">Google</option>
            <option value="yahoo">Yahoo! JAPAN</option>
            <option value="bing">Bing</option>
          </select>
        </label>
        <button class="primary" id="openSelected" type="button">選択項目を開く</button>
        <button class="icon-button copy-button" id="copyQueries" type="button" title="検索語をコピー" aria-label="検索語をコピー"></button>
      </div>

      <div class="toolbar">
        <div class="chips" aria-label="選択操作">
          <button class="chip" id="selectAll" type="button">全選択</button>
          <button class="chip" id="selectCore" type="button">主要項目</button>
          <button class="chip" id="clearAll" type="button">解除</button>
        </div>
        <input class="query-filter" id="keywordFilter" type="search" placeholder="項目を絞り込み">
      </div>

      <div class="grid" id="keywordGrid" aria-label="規制項目"></div>
      <div class="status" id="status">行政区を入力すると各項目の検索リンクが有効になります。</div>
      <div class="results" id="results">
        <h2>検索リンク</h2>
        <ul class="result-list" id="resultList"></ul>
      </div>
    </section>
  </main>

  <script>
    const keywords = [
      "都市計画区域",
      "用途地域",
      "形態制限",
      "指定容積率",
      "指定建蔽率",
      "防火地域",
      "最低敷地面積",
      "高度地区",
      "日影規制",
      "特別用途地区",
      "風致地区",
      "開発許可",
      "特定盛土規制法",
      "警戒区域",
      "市街地開発事業",
      "都市計画施設",
      "地区計画",
      "道路",
      "下水道",
      "浄化槽",
      "駐車場条例",
      "駐輪場条例",
      "バリアフリー条例",
      "中高層建築物条例",
      "建築基準条例",
      "都市緑地法",
      "屋外広告物条例",
      "港湾法",
      "斜面地条例",
      "流通業務市街地整備法",
      "特定都市河川浸水被害対策法",
      "建築協定区域",
      "一団地の区域"
    ];

    const coreKeywords = new Set([
      "都市計画区域",
      "用途地域",
      "形態制限",
      "指定容積率",
      "指定建蔽率",
      "防火地域",
      "高度地区",
      "日影規制",
      "道路",
      "下水道",
      "建築基準条例",
      "地区計画"
    ]);

    const areaInput = document.querySelector("#areaInput");
    const engineSelect = document.querySelector("#engineSelect");
    const keywordGrid = document.querySelector("#keywordGrid");
    const keywordFilter = document.querySelector("#keywordFilter");
    const selectedCount = document.querySelector("#selectedCount");
    const status = document.querySelector("#status");
    const openSelected = document.querySelector("#openSelected");
    const copyQueries = document.querySelector("#copyQueries");
    const results = document.querySelector("#results");
    const resultList = document.querySelector("#resultList");
    let resultOrder = [];
    let draggedKeyword = "";
    let pointerDraggedItem = null;
    let searchReady = false;

    const searchUrls = {
      google: query => `https://www.google.com/search?q=${encodeURIComponent(query)}`,
      yahoo: query => `https://search.yahoo.co.jp/search?p=${encodeURIComponent(query)}`,
      bing: query => `https://www.bing.com/search?q=${encodeURIComponent(query)}`
    };

    function makeQuery(keyword) {
      return `${areaInput.value.trim()} ${keyword}`.trim();
    }

    function makeUrl(keyword) {
      return searchUrls[engineSelect.value](makeQuery(keyword));
    }

    function getVisibleItems() {
      return Array.from(keywordGrid.querySelectorAll(".item")).filter(item => !item.hidden);
    }

    function getSelectedKeywords() {
      return Array.from(keywordGrid.querySelectorAll("input[type='checkbox']:checked")).map(input => input.value);
    }

    function getOrderedSelectedKeywords() {
      const selected = getSelectedKeywords();
      const selectedSet = new Set(selected);
      resultOrder = [
        ...resultOrder.filter(keyword => selectedSet.has(keyword)),
        ...selected.filter(keyword => !resultOrder.includes(keyword))
      ];
      return resultOrder;
    }

    function updateLinks() {
      const hasArea = areaInput.value.trim().length > 0;
      keywordGrid.querySelectorAll(".open-link").forEach(link => {
        const keyword = link.dataset.keyword;
        link.href = hasArea && searchReady ? makeUrl(keyword) : "#";
        link.setAttribute("aria-disabled", String(!hasArea || !searchReady));
      });

      const selected = getOrderedSelectedKeywords();
      selectedCount.textContent = selected.length;
      openSelected.disabled = selected.length === 0 || !hasArea;
      renderResults(hasArea && searchReady, selected);

      if (!hasArea) {
        status.textContent = "行政区を入力すると各項目の検索リンクが有効になります。";
      } else if (selected.length === 0) {
        status.textContent = "検索したい規制項目を選択してください。";
      } else if (!searchReady) {
        status.textContent = "「選択項目を開く」を押すと、選択した項目の検索リンクが有効になります。";
      } else {
        status.textContent = `${areaInput.value.trim()} と ${selected.length} 件の検索リンクを表示しました。`;
      }
    }

    function renderResults(hasArea, selected) {
      resultList.innerHTML = "";
      results.classList.toggle("is-visible", hasArea && selected.length > 0);

      if (!hasArea || selected.length === 0) return;

      selected.forEach(keyword => {
        const item = document.createElement("li");
        item.className = "result-item";
        item.draggable = true;
        item.dataset.keyword = keyword;

        const handle = document.createElement("span");
        handle.className = "drag-handle";
        handle.textContent = "⋮⋮";
        handle.title = "ドラッグして並べ替え";
        handle.ariaLabel = `${keyword}を並べ替え`;

        const link = document.createElement("a");
        link.href = makeUrl(keyword);
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = makeQuery(keyword);
        item.append(handle, link);
        resultList.append(item);
      });
    }

    function renderKeywords() {
      const filter = keywordFilter.value.trim().toLowerCase();
      keywordGrid.innerHTML = "";

      keywords.forEach(keyword => {
        const item = document.createElement("div");
        item.className = "item";
        item.hidden = filter.length > 0 && !keyword.toLowerCase().includes(filter);

        const label = document.createElement("label");
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = keyword;

        const name = document.createElement("span");
        name.className = "keyword";
        name.textContent = keyword;

        const link = document.createElement("a");
        link.className = "open-link";
        link.dataset.keyword = keyword;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "↗";
        link.ariaLabel = `${keyword}を検索`;

        label.append(checkbox, name, link);
        item.append(label);
        keywordGrid.append(item);
      });

      updateLinks();
    }

    function setVisibleChecks(checked) {
      getVisibleItems().forEach(item => {
        item.querySelector("input[type='checkbox']").checked = checked;
      });
      updateLinks();
    }

    document.querySelector("#selectAll").addEventListener("click", () => setVisibleChecks(true));
    document.querySelector("#clearAll").addEventListener("click", () => setVisibleChecks(false));
    document.querySelector("#selectCore").addEventListener("click", () => {
      keywordGrid.querySelectorAll("input[type='checkbox']").forEach(input => {
        input.checked = coreKeywords.has(input.value);
      });
      updateLinks();
    });

    keywordGrid.addEventListener("change", updateLinks);
    keywordGrid.addEventListener("click", event => {
      const link = event.target.closest(".open-link");
      if (!link) return;

      event.stopPropagation();
      if (link.getAttribute("aria-disabled") === "true") {
        event.preventDefault();
      }
    });
    areaInput.addEventListener("input", () => {
      searchReady = false;
      updateLinks();
    });
    engineSelect.addEventListener("change", updateLinks);
    keywordFilter.addEventListener("input", renderKeywords);

    resultList.addEventListener("dragstart", event => {
      const item = event.target.closest(".result-item");
      if (!item) return;
      draggedKeyword = item.dataset.keyword;
      item.classList.add("is-dragging");
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", draggedKeyword);
    });

    resultList.addEventListener("dragover", event => {
      const item = event.target.closest(".result-item");
      if (!item || item.dataset.keyword === draggedKeyword) return;
      event.preventDefault();
      resultList.querySelectorAll(".is-drag-over").forEach(target => target.classList.remove("is-drag-over"));
      item.classList.add("is-drag-over");
      event.dataTransfer.dropEffect = "move";
    });

    resultList.addEventListener("dragleave", event => {
      const item = event.target.closest(".result-item");
      if (item && !item.contains(event.relatedTarget)) item.classList.remove("is-drag-over");
    });

    resultList.addEventListener("drop", event => {
      const target = event.target.closest(".result-item");
      if (!target || !draggedKeyword || target.dataset.keyword === draggedKeyword) return;
      event.preventDefault();

      const fromIndex = resultOrder.indexOf(draggedKeyword);
      const targetIndex = resultOrder.indexOf(target.dataset.keyword);
      const targetBox = target.getBoundingClientRect();
      const placeAfter = event.clientY > targetBox.top + targetBox.height / 2;

      resultOrder.splice(fromIndex, 1);
      const adjustedTargetIndex = resultOrder.indexOf(target.dataset.keyword);
      resultOrder.splice(adjustedTargetIndex + (placeAfter ? 1 : 0), 0, draggedKeyword);
      renderResults(true, resultOrder);
    });

    resultList.addEventListener("dragend", () => {
      draggedKeyword = "";
      resultList.querySelectorAll(".result-item").forEach(item => {
        item.classList.remove("is-dragging", "is-drag-over");
      });
    });

    resultList.addEventListener("pointerdown", event => {
      const handle = event.target.closest(".drag-handle");
      if (!handle) return;

      event.preventDefault();
      pointerDraggedItem = handle.closest(".result-item");
      pointerDraggedItem.classList.add("is-dragging");
      handle.setPointerCapture?.(event.pointerId);
    });

    document.addEventListener("pointermove", event => {
      if (!pointerDraggedItem) return;
      event.preventDefault();

      const target = document.elementFromPoint(event.clientX, event.clientY)?.closest(".result-item");
      if (!target || target === pointerDraggedItem || !resultList.contains(target)) return;

      const box = target.getBoundingClientRect();
      const sameRow = Math.abs(event.clientY - (box.top + box.height / 2)) < box.height / 2;
      const placeAfter = sameRow
        ? event.clientX > box.left + box.width / 2
        : event.clientY > box.top + box.height / 2;

      resultList.insertBefore(pointerDraggedItem, placeAfter ? target.nextSibling : target);
    }, { passive: false });

    document.addEventListener("pointerup", () => {
      if (!pointerDraggedItem) return;

      pointerDraggedItem.classList.remove("is-dragging");
      resultOrder = Array.from(resultList.querySelectorAll(".result-item")).map(item => item.dataset.keyword);
      pointerDraggedItem = null;
    });

    openSelected.addEventListener("click", () => {
      const selected = getOrderedSelectedKeywords();
      if (!areaInput.value.trim() || selected.length === 0) {
        updateLinks();
        return;
      }

      searchReady = true;
      updateLinks();
      status.innerHTML = `<strong>${selected.length}件</strong> の矢印と検索リンクを有効にしました。`;
    });

    copyQueries.addEventListener("click", async () => {
      const selected = getOrderedSelectedKeywords();
      const targets = selected.length > 0 ? selected : keywords;
      const text = targets.map(makeQuery).join("\n");

      if (!areaInput.value.trim()) {
        status.textContent = "行政区を入力してからコピーしてください。";
        return;
      }

      try {
        await navigator.clipboard.writeText(text);
        status.textContent = `${targets.length} 件の検索語をコピーしました。`;
      } catch {
        status.textContent = "コピーできませんでした。ブラウザの権限を確認してください。";
      }
    });

    renderKeywords();
  </script>
</body>
</html>
